<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heraclitus Platform | Epistemic Lake-Build Monitor</title>
    <!-- Link out to our external style module -->
    <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>HERACLITUS FRONT-END COMPILER</h1>
                <div class="meta-target">Live Ingestion URL: <span class="text-highlight">https://wikipedia.org</span></div>
            </div>
            <a href="/download-sve" class="btn-download">Download Validated.sve</a>
        </header>

        <div class="dashboard-grid">
            <!-- Left Side: Gauge Metrics Panel -->
            <div class="panel gauge-container">
                <div class="trace-title">INDUSTRIAL LOGOS METRICS</div>
                <div class="radial-gauge" id="metricGauge">
                    <div class="gauge-value" id="objectivityPct">--%</div>
                </div>
                <div class="metrics-list">
                    <div class="metric-row"><span class="text-muted">Active Lemmas</span><strong id="totalLemmas">0</strong></div>
                    <div class="metric-row"><span class="text-muted">Total Chunks</span><strong id="totalChunks">0</strong></div>
                    <div class="metric-row"><span class="text-muted">Verified Clean</span><span class="text-clean" id="cleanChunks">0</span></div>
                    <div class="metric-row"><span class="text-muted">Quarantined Faults</span><span class="text-quarantine" id="quarantinedChunks">0</span></div>
                </div>
            </div>

            <!-- Right Side: Philosophical Classification Tracker -->
            <div class="panel">
                <div class="tab-bar">
                    <button class="tab-btn active" onclick="switchPillar('epistemology')" id="tab-epistemology">Epistemology (<span id="count-epistemology">0</span>)</button>
                    <button class="tab-btn" onclick="switchPillar('ontology')" id="tab-ontology">Ontology (<span id="count-ontology">0</span>)</button>
                    <button class="tab-btn" onclick="switchPillar('phenomenology')" id="tab-phenomenology">Phenomenology (<span id="count-phenomenology">0</span>)</button>
                </div>
                
                <div id="traceContainer">
                    <p class="text-muted">Awaiting pipeline stream ingestion...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Inject our asynchronous runtime engine controller -->
    <script src="/telemetry.js"></script>
</body>
</html>
